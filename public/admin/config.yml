# Decap CMS configuration
#
# PER-SITE SETUP (do this in each client repo generated from this template):
#   1. Replace OWNER/REPO below with the client site's GitHub repo (e.g. ampolic/client-acme).
#   2. Register a GitHub OAuth app and an OAuth proxy (Cloudflare Worker or similar),
#      then set base_url/auth_endpoint here to point at it — the plain `github`
#      backend needs an OAuth gateway when not hosted on Netlify.
#   3. Editors need write access to the repo. All CMS commits land on `dev`
#      (staging); production only updates via the dev -> main PR.
#   4. Keep collections below in sync with src/content.config.ts and
#      src/content/schemas.ts — they are the source of truth.
#
# Agents: do NOT change the backend settings in this file.

backend:
  name: github
  repo: ampolic/site-ampolic
  branch: dev
  # OAuth gateway: the decap-auth Cloudflare Worker (ampolic-core/workers/decap-auth)
  base_url: https://decap-auth.muddy-voice-3b5b.workers.dev


# Media library = the site's real image directory, so the CMS picker can select
# existing assets (team photos, work screenshots, …). Paths are stored absolute
# (/src/assets/images/…) — Sveltia requires it; pages resolve them via
# import.meta.glob, which fails the build on any broken path.
media_folder: src/assets/images
public_folder: /src/assets/images

collections:
  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    extension: md
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Meta description, widget: string }
      - { name: date, label: Date, widget: datetime, required: false }
      - { name: updated, label: Updated, widget: datetime, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: services
    label: Services
    folder: src/content/services
    create: true
    extension: md
    # List view: show site order in the row label and allow sorting by it.
    summary: '{{fields.order}} · {{fields.title}}'
    sortable_fields: ['order', 'title']
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: string }
      - { name: description, label: Meta description, widget: string, required: false }
      - { name: icon, label: Icon (Lucide name), widget: string }
      - { name: order, label: Order, widget: number }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: image, label: Image, widget: image, required: false }
      - { name: imageAlt, label: Image alt text, widget: string, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: team
    label: Team members
    folder: src/content/team
    create: true
    extension: md
    summary: '{{fields.order}} · {{fields.name}}'
    sortable_fields: ['order', 'name']
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string }
      - { name: order, label: Order, widget: number }
      - { name: website, label: Website URL, widget: string, required: false }
      - { name: linkLabel, label: Link label, widget: string, default: Visit Website, required: false }
      - { name: photo, label: Photo, widget: image }
      - { name: body, label: Bio, widget: markdown }

  - name: pricing
    label: Pricing tiers
    folder: src/content/pricing
    create: true
    extension: md
    summary: '{{fields.order}} · {{fields.name}} — {{fields.price}}{{fields.period}}'
    sortable_fields: ['order', 'name']
    fields:
      - { name: name, label: Tier name, widget: string }
      - { name: price, label: Current price (e.g. $39), widget: string }
      - { name: regular, label: Regular price (struck through), widget: string, required: false }
      - { name: period, label: Period, widget: string, default: /mo, required: false }
      - { name: blurb, label: Blurb, widget: string, required: false }
      - { name: features, label: Features, widget: list, field: { name: feature, label: Feature, widget: string } }
      - { name: featured, label: Featured (highlighted card), widget: boolean, default: false }
      - { name: order, label: Order, widget: number }

  - name: faq
    label: FAQ
    folder: src/content/faq
    create: true
    extension: md
    summary: '{{fields.order}} · {{fields.question}}'
    sortable_fields: ['order', 'question']
    fields:
      - { name: question, label: Question, widget: string }
      - { name: icon, label: 'Icon (lucide name, e.g. lucide:globe)', widget: string, required: false }
      - { name: order, label: Order, widget: number }
      - { name: body, label: Answer, widget: markdown }
